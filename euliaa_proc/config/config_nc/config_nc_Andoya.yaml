
dimensions:
  unlimited:
  - time
  fixed:
  - altitude_mie
  - altitude_ray
  - altitude
  - line_of_sight
  - bnds
variables:
  time:
    name: time
    dim:
    - time
    type: float64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: rec
      hdf5_var_name: time
    attributes:
      long_name: Time (UTC) of the measurement
      standard_name: time
      units: seconds since 1970-01-01
      comment: Time indication of samples is at the end of integration time
  time_bnds:
    name: time_bnds
    dim:
    - time
    - bnds
    type: float64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Time bounds (UTC) of the measurement
      standard_name: time
      units: seconds since 1970-01-01
  height_bnds:
    name: height_bnds
    dim:
    - altitude
    - bnds
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Height bounds of the measurement, for combined Rayleigh/Mie peak measurements
      units: m
  altitude:
    name: altitude
    dim:
    - altitude
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Altitude above mean sea level, for combined Rayleigh/Mie peak measurements
      units: m
      comment: Altitude coordinate is at the center of integration window
  altitude_mie:
    name: altitude_mie
    dim:
    - altitude_mie
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: glo
      hdf5_var_name: altInt
    attributes:
      long_name: Altitude above mean sea level, for Mie peak measurements
      units: m
      comment: Altitude coordinate is at the center of integration window
  altitude_ray:
    name: altitude_ray
    dim:
    - altitude_ray
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: glo
      hdf5_var_name: altInt
    attributes:
      long_name: Altitude above mean sea level, for Rayleigh peak measurements
      units: m
      comment: Altitude coordinate is at the center of integration window
  line_of_sight:
    name: line_of_sight
    dim:
    - line_of_sight
    type: int64
    _FillValue: null
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Measurement fields of view
      comment: 0=zenith, then, if azimuth_offset is 0deg, 1=eastward, 2=northward (off-zenith beams are 30deg slanted)
      units: "1"
    value:
    - 0
    - 1
    - 2
  latitude_mie:
    name: latitude_mie
    dim:
    - altitude_mie
    - line_of_sight
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Latitude corresponding to altitude array in each field of view, for
        Mie peak measurements
      units: degrees_north
      comment: Derived using 30deg off-zenith slant in line of sight direction
  latitude_ray:
    name: latitude_ray
    dim:
    - altitude_ray
    - line_of_sight
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Latitude corresponding to altitude array in each field of view, for
        Rayleigh peak measurements
      units: degrees_north
      standard_name: latitude
      comment: Derived using 30deg off-zenith slant in line of sight direction
  longitude_mie:
    name: longitude_mie
    dim:
    - altitude_mie
    - line_of_sight
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Longitude corresponding to altitude array in each field of view,
        for Mie peak measurements
      units: degrees_east
      standard_name: longitude
      comment: Derived using 30deg off-zenith slant in line of sight direction
  longitude_ray:
    name: longitude_ray
    dim:
    - altitude_ray
    - line_of_sight
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Longitude corresponding to altitude array in each field of view,
        for Rayleigh peak measurements
      units: degrees_east
      standard_name: longitude
      comment: Derived using 30deg off-zenith slant in line of sight direction
  station_latitude:
    name: station_latitude
    dim: ''
    type: float64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: glo
      hdf5_var_name: Latitude
    attributes:
      long_name: Latitude of measurement station
      standard_name: latitude
      units: degrees_north
    # value: 54.12
  station_longitude:
    name: station_longitude
    dim: ''
    type: float64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: glo
      hdf5_var_name: Longitude
    attributes:
      long_name: Longitude of measurement station
      units: degrees_east
      standard_name: longitude
    # value: 11.77
  station_altitude:
    name: station_altitude
    dim: ''
    type: float64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Altitude of measurement station
      standard_name: altitude
      units: m
    # value: 10.
  range_integration:
    name: range_integration
    dim:
    - line_of_sight
    type: int64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: glo
      hdf5_var_name: AltitudeIntegration
    attributes:
      long_name: Range integration window
      units: m
    # value: 
    #   - 250
    #   - 250
    #   - 250
  time_integration:
    name: time_integration
    dim: ''
    type: int64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: glo
      hdf5_var_name: shiftSec
    attributes:
      long_name: Time integration window
      units: s
      comment: As raw spectra are measured successively in the different lines of sight,
        the effective cumulated duration of the measurement per line of sight is time_integration divided
        by number of line_of_sight entries. 
  status:
    name: status
    dim:
    - time
    type: int64
    _FillValue: -999
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Status of the measurement
      units: "1"
      comment: 0 = running, 1 = paused for rain, 2 = paused for aircraft, 3 = scheduled maintenance, 4 = faulty
  backscatter_coef:
    name: backscatter_coef
    dim:
    - time
    - altitude_mie
    - line_of_sight
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: rec
      hdf5_var_name:
      - BSCMieZ
      - BSCMieE
      - BSCMieN
    attributes:
      long_name: Particle backscatter coefficient
      units: m-1 sr-1
      scattering_regime: Mie
  backscatter_coef_err:
    name: backscatter_coef_err
    dim:
    - time
    - altitude_mie
    - line_of_sight
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: rec
      hdf5_var_name:
      - BSCMieZErr
      - BSCMieEErr
      - BSCMieNErr
    attributes:
      long_name: Uncertainty on particle backscatter coefficient
      units: m-1 sr-1
      scattering_regime: Mie
      comment: Error propagated from photon count
  backscatter_coef_flag:
    name: backscatter_coef_flag
    dim:
    - time
    - altitude_mie
    - line_of_sight
    type: int64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Quality flag for particle backscatter coefficient
      units: "1"
      comment: 0 = valid, >1 = suspect, -9 = no data. Flag>1 is sum of all flag conditions (1 = unrealistic value, 2 = low SNR, 4 = high error, 8 = below minimum valid range, 16 = inside cloud, 32 = below cloud/aerosol layer top)
  
  backscatter_coef_depol:
    name: backscatter_coef_depol
    dim:
    - time
    - altitude_mie
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: rec
      hdf5_var_name: BSCMieD
    attributes:
      long_name: Particle backscatter coefficient calculated from cross-polar zenith channel
      units: m-1 sr-1
      scattering_regime: Mie
  backscatter_coef_depol_err:
    name: backscatter_coef_depol_err
    dim:
    - time
    - altitude_mie
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: rec
      hdf5_var_name: BSCMieDErr
    attributes:
      long_name: Uncertainty on particle backscatter coefficient calculated from cross-polar zenith channel
      units: m-1 sr-1
      scattering_regime: Mie
      comment: Error propagated from photon count
  backscatter_coef_depol_flag:
    name: backscatter_coef_depol_flag
    dim:
    - time
    - altitude_mie
    type: int64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Quality flag for particle backscatter coefficient calculated from cross-polar zenith channel
      units: "1"
      comment: 0 = valid, >1 = suspect, -9 = no data. Flag>1 is sum of all flag conditions (1 = unrealistic value, 2 = low SNR, 4 = high error)
  
  aerosol_depolarization_ratio:
    name: aerosol_depolarization_ratio
    dim:
    - time
    - altitude_mie
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null 
      hdf5_var_name: null
    attributes:
      long_name: Linear aerosol depolarization ratio
      units: "1"
      scattering_regime: Mie
  aerosol_depolarization_ratio_err:
    name: aerosol_depolarization_ratio_err
    dim:
    - time
    - altitude_mie
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Uncertainty on linear aerosol depolarization ratio
      units: "1"
      scattering_regime: Mie
      comment: Error propagated from photon count
  aerosol_depolarization_ratio_flag:
    name: aerosol_depolarization_ratio_flag
    dim:
    - time
    - altitude_mie
    type: int64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Quality flag for linear aerosol depolarization ratio
      units: "1"
      comment: 0 = valid, >1 = suspect, -9 = no data. Flag>1 is sum of all flag conditions (1 = unrealistic value, 2 = low SNR, 4 = high error)
  backscatter_ratio:
    name: backscatter_ratio
    dim:
    - time
    - altitude_mie
    - line_of_sight
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: rec
      hdf5_var_name:
      - BSRMieZ
      - BSRMieE
      - BSRMieN
    attributes:
      long_name: Backscatter ratio
      units: "1"
      scattering_regime: Mie
  backscatter_ratio_err:
    name: backscatter_ratio_err
    dim:
    - time
    - altitude_mie
    - line_of_sight
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: rec
      hdf5_var_name:
      - BSRMieZErr
      - BSRMieEErr
      - BSRMieNErr
    attributes:
      long_name: Uncertainty on backscatter ratio
      units: "1"
      scattering_regime: Mie
      comment: Error propagated from photon count
  temperature_int:
    name: temperature_int
    dim:
    - time
    - altitude_mie
    - line_of_sight
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: rec
      hdf5_var_name:
      - TRayIntZ
      - TRayIntE
      - TRayIntN
    attributes:
      long_name: Temperature from Rayleigh integration
      standard_name: air_temperature
      units: K
      scattering_regime: Rayleigh
      retrieval_method: Rayleigh integration
  temperature_int_err:
    name: temperature_int_err
    dim:
    - time
    - altitude_mie
    - line_of_sight
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: rec
      hdf5_var_name:
      - TRayIntZErr
      - TRayIntEErr
      - TRayIntNErr
    attributes:
      long_name: Uncertainty on temperature from Rayleigh integration
      units: K
      scattering_regime: Rayleigh
      retrieval_method: Rayleigh integration
      comment: Error propagated from photon count
  temperature_int_flag:
    name: temperature_int_flag
    dim:
    - time
    - altitude_mie
    - line_of_sight
    type: int64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Quality flag for temperature from Rayleigh integration
      units: "1"
      comment: 0 = valid, >1 = suspect, -9 = no data. Flag>1 is sum of all flag conditions (1 = unrealistic value, 2 = low SNR, 4 = high error, 8 = below top of transparent cloud)
  temperature_broad:
    name: temperature_broad
    dim:
    - time
    - altitude_mie
    - line_of_sight
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Temperature from Doppler broadening
      standard_name: air_temperature
      units: K
      scattering_regime: Rayleigh
      retrieval_method: Doppler broadening
  temperature_broad_err:
    name: temperature_broad_err
    dim:
    - time
    - altitude_mie
    - line_of_sight
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Uncertainty on temperature from Doppler broadening
      units: K
      scattering_regime: Rayleigh
      retrieval_method: Doppler broadening
      comment: Error propagated from spectrum fitting, combines statistical measurement
