dimensions:
  unlimited:
  - time
  fixed:
  - layer
  - range

variables:
  time:
    dim:
    - time
    units: seconds since 1904-01-01 00:00:00.000 00:00
    long_name: time UTC
    axis: T
    type: double
  
  layer:
    dim:
    - layer
    long_name: layer index
    type: int
  
  range:
    dim:
    - range
    units: m
    long_name: distance from lidar
    axis: Z
    type: double
    _FillValue: .NaN
  
  # Scalar coordinates
  latitude:
    dim: []
    units: degrees_north
    long_name: latitude of site
    type: float
    _FillValue: .NaN
  
  longitude:
    dim: []
    units: degrees_east
    long_name: longitude of site
    type: float
    _FillValue: .NaN
  
  altitude:
    dim: []
    units: m
    long_name: altitude of ceilometer above mean sea level
    type: float
    _FillValue: .NaN
  
  azimuth:
    dim: []
    units: degree
    long_name: laser direction of site
    type: float
    _FillValue: .NaN
  
  zenith:
    dim: []
    units: degree
    long_name: laser direction of site
    type: float
    _FillValue: .NaN
  
  wavelength:
    dim: []
    units: nm
    long_name: laser wavelength
    type: float
    _FillValue: .NaN
  
  range_gate:
    dim: []
    units: m
    long_name: length of range gate, binwidth
    type: float
    _FillValue: .NaN
  
  range_gate_hr:
    dim: []
    units: m
    long_name: length of range gate with high resolution, binwidth
    type: float
    _FillValue: .NaN
  
  scaling:
    dim: []
    long_name: scaling factor (cs)
    type: float
    _FillValue: .NaN
  
  cho:
    dim: []
    units: m
    long_name: cloud height offset
    type: short
    _FillValue: -999
  
  # Time-dependent variables
  average_time:
    dim:
    - time
    units: ms
    long_name: average time per record
    type: int
    _FillValue: -999
  
  life_time:
    dim:
    - time
    units: h
    long_name: laser life time
    type: int
    _FillValue: -999
  
  error_ext:
    dim:
    - time
    long_name: 32 bit service code
    type: int
    _FillValue: -999
  
  state_laser:
    dim:
    - time
    units: percent
    long_name: laser quality index
    type: byte
    _FillValue: -127
  
  state_detector:
    dim:
    - time
    units: percent
    long_name: quality of detector signal
    type: byte
    _FillValue: -127
  
  state_optics:
    dim:
    - time
    units: percent
    long_name: transmission of optics
    type: byte
    _FillValue: -127
  
  temp_int:
    dim:
    - time
    units: K
    long_name: internal temperature
    type: double
    _FillValue: .NaN
  
  temp_ext:
    dim:
    - time
    units: K
    long_name: external temperature
    type: double
    _FillValue: .NaN
  
  temp_det:
    dim:
    - time
    units: K
    long_name: detector temperature
    type: double
    _FillValue: .NaN
  
  temp_lom:
    dim:
    - time
    units: K
    long_name: laser optic module temperature
    type: double
    _FillValue: .NaN
  
  laser_pulses:
    dim:
    - time
    long_name: number of laser pulses per record (lp)
    type: int
    _FillValue: -999
  
  p_calc:
    dim:
    - time
    units: counts
    long_name: calibration pulse in photons per shot
    type: double
    _FillValue: .NaN
  
  base:
    dim:
    - time
    units: counts
    long_name: baseline raw signal in photons per shot (b)
    type: float
    _FillValue: .NaN
  
  stddev:
    dim:
    - time
    units: counts
    long_name: standard deviation raw signal in photons per shot
    type: float
    _FillValue: .NaN
  
  tcc:
    dim:
    - time
    long_name: total cloud cover
    type: byte
    _FillValue: -127
  
  bcc:
    dim:
    - time
    long_name: base cloud cover
    type: byte
    _FillValue: -127
  
  sci:
    dim:
    - time
    long_name: "sky condition index (0: nothing, 1: rain, 2: fog, 3: snow, 4: precipitation or particles on window)"
    type: byte
    _FillValue: -127
  
  vor:
    dim:
    - time
    units: m
    long_name: vertical optical range
    type: short
    _FillValue: -999
  
  voe:
    dim:
    - time
    units: m
    long_name: vertical optical range error
    type: short
    _FillValue: -999
  
  mxd:
    dim:
    - time
    units: m
    long_name: maximum detection height
    type: short
    _FillValue: -999
  
  nn1:
    dim:
    - time
    long_name: nn1
    type: short
    _FillValue: -999
  
  nn2:
    dim:
    - time
    long_name: nn2
    type: short
    _FillValue: -999
  
  nn3:
    dim:
    - time
    long_name: nn3
    type: short
    _FillValue: -999
  
  # Main data variables (time, range)
  beta_raw:
    dim:
    - time
    - range
    units: m-1 sr-1
    long_name: Volume backscatter coefficient from EULIAA L2A data
    source: L2A backscatter_coef (line_of_sight=0)
    type: float
    _FillValue: .NaN
  
  # Layer-dependent variables (time, layer)
  pbl:
    dim:
    - time
    - layer
    units: m
    long_name: aerosol layer in PBL
    type: short
    _FillValue: -999
  
  pbs:
    dim:
    - time
    - layer
    long_name: quality score for aerosol layer in PBL
    type: byte
    _FillValue: -127
  
  cbh:
    dim:
    - time
    - layer
    units: m
    long_name: Lowest cloud base height detected in EULIAA L2A data
    source: L2A cloud mask (line_of_sight=0)
    type: double
    _FillValue: .NaN
  
  cbe:
    dim:
    - time
    - layer
    units: m
    long_name: cloud base height variation
    type: short
    _FillValue: -999
  
  cdp:
    dim:
    - time
    - layer
    units: m
    long_name: cloud depth
    type: short
    _FillValue: -999
  
  cde:
    dim:
    - time
    - layer
    units: m
    long_name: cloud depth variation
    type: short
    _FillValue: -999

