    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: rec
      hdf5_var_name: VMieN
    attributes:
      long_name: Northward wind from Doppler shift of Mie peak
      standard_name: northward_wind
      units: m s-1
      scattering_regime: Mie
  v_mie_err:
