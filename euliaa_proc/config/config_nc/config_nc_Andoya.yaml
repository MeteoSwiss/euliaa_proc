    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Temperature combined from Doppler broadening and Rayleigh integration
      standard_name: air_temperature
      units: K
      scattering_regime: Rayleigh
      retrieval_method: Doppler broadening and Rayleigh integration combined
  temperature_flag:
    name: temperature_flag
    dim:
    - time
    - altitude
    - line_of_sight
    type: int64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
