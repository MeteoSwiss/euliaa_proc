  w_ray_flag:
    name: w_ray_flag
    dim:
    - time
    - altitude_ray
    type: int64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Quality flag for upward air velocity from Doppler shift of Rayleigh
        peak
      units: "1"
      comment: 0 = valid, >1 = suspect, -9 = no data. Flag>1 is sum of all flag conditions (1 = unrealistic value, 2 = low SNR, 4 = high error)
  u_ray:
    name: u_ray
    dim:
    - time
    - altitude_ray
    type: float32
