MAX_ALTITUDE: 60000.
SNR_THRES:
  w_mie: 10 # -
  u_mie: 10 # -
  v_mie: 10 # -
  temperature_int: 0 # -
  backscatter_coef: 5 # -
  backscatter_coef_depol: 5 # -
ERR_THRES:
  w_mie: 0.6 # m/s
  u_mie: 0.6 # m/s
  v_mie: 0.6 # m/s
  temperature_int: 5 # K
  backscatter_coef: .inf
  backscatter_coef_depol: .inf
THRES_MIN:
  w_mie: -40.96
  u_mie: -409.6
  v_mie: -409.6
  temperature_int: 0
  backscatter_coef: 0 # m-1 sr-1
  backscatter_coef_depol: 0
THRES_MAX:
  w_mie: 40.96
  u_mie: 409.6
  v_mie: 409.6
  temperature_int: 409.5
  backscatter_coef: .inf
  backscatter_coef_depol: .inf
MIN_RANGE_FOR_FLAG:
  w_mie: 2500. # m
  u_mie: 2500. # m
  v_mie: 2500. # m
  temperature_int: 2500. # m
  backscatter_coef: 0. # m # note: if we set this too high we might lose data that is relevant for cloud detection. better not be too conservative here, though 0 might be a bit extreme.
  backscatter_coef_depol: 0. # m

CORRECTION: -28.8461 # velocity correction for frequency offset = -28.8461 (remove if IAP fixes it themselves)
MULTIPLY_BY: 2.0 # velocity correction for off-zenith slant, remove if IAP fixes it themselves
VARS_TO_KEEP: # list of variables to keep in the L2B file # this is for internal use for quicklooks (no external distribution)
- altitude
- temperature
- temperature_flag
- w
- v
- u
- w_flag
- v_flag
- u_flag
- backscatter_coef
- backscatter_coef_flag
- station_latitude
- station_longitude
- station_altitude
- range_integration
- time_integration

EPROFILE_SKIP_EVERY_SECOND_ALTITUDE: True # whether to skip every second altitude in the eprofile files, so that no overlapping measurements
EPROFILE_SET_INVALID_TO_NAN: True # whether to set invalid values (flag !=0) to NaN in the E-Profile files


