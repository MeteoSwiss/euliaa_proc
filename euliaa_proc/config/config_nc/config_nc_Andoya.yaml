      scattering_regime: Mie and Rayleigh combined
  v_flag:
    name: v_flag
    dim:
    - time
    - altitude
    type: int64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Quality flag for northward wind combined from Doppler shift of Mie and Rayleigh peak
      units: "1"
      comment: 0 = valid, >1 = suspect, -9 = no data. Flag>1 is sum of all flag conditions (1 = unrealistic value, 2 = low SNR, 4 = high error)
  w_ray:
    name: w_ray
    dim:
    - time
    - altitude_ray
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Upward air velocity from Doppler shift of Rayleigh peak
      units: m s-1
      scattering_regime: Rayleigh
  w_ray_err:
    name: w_ray_err
    dim:
    - time
    - altitude_ray
    type: float32
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
