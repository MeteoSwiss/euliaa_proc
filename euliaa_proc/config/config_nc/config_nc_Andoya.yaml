    _FillValue: -999.0
    original_hdf5:
      hdf5_group: rec
      hdf5_var_name: VMieZ
    attributes:
      long_name: Upward air velocity from Doppler shift of Mie peak
      units: m s-1
      scattering_regime: Mie
