[project]
name = "euliaa_proc"
version = "0.1.0"
description = ""
authors = [
    {name = "Anne-Claire Billault-Roux",email = "anne-claire.billault-roux@meteoswiss.ch"}
]
readme = "README.md"
requires-python = ">=3.10, <3.12"
dependencies = [
    "jupyterlab (>=4.6.4,<5.0.0)",
    "eccodes (>=2.40.1,<3.0.0)",
    "ipywidgets (>=8.1.5,<9.0.0)",
    "pyarrow (>=25.0.0,<26.0.0)",
    "h5netcdf (>=1.6.1,<2.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "colorlog (>=6.9.0,<7.0.0)",
    "boto3 (>=1.38.20,<2.0.0)",
    "botocore (>=1.38.20,<2.0.0)",
    "flask (>=3.1.3,<4.0.0)",
    "waitress (>=3.0.2,<4.0.0)",
    "plotly (>=6.4.0,<7.0.0)",

# --- Security floors for transitive dependencies (Dependabot alerts) ---
# These are not imported directly; they are pulled in via jupyterlab, boto3/botocore,
# flask and nbconvert. The lower bounds below are the earliest advisory-free releases
# that remain compatible with requires-python ">=3.10,<3.12".
# NOTE: tornado is capped by Python 3.10 support -- the fully clean release is 6.6,
# which requires Python >=3.11. 6.5.10 clears all HIGH-severity advisories but leaves
# GHSA-pcg2-g6cj-q92c, GHSA-r4j5-9xpp-3985 (moderate) and GHSA-pw9p-v7r6-gx4p (low).
    "urllib3 (>=2.8.0,<3.0.0)",
    "tornado (>=6.5.10,<7.0.0)",
    "nbconvert (>=7.17.2,<8.0.0)",
    "jupyter-server (>=2.21.0,<3.0.0)",
    "mistune (>=3.3.3,<4.0.0)",
    "bleach (>=6.4.0,<7.0.0)",
    "requests (>=2.33.0,<3.0.0)",
    "werkzeug (>=3.1.9,<4.0.0)",
    "anyio (>=4.14.2,<5.0.0)",
    "pygments (>=2.20.0,<3.0.0)",
    "soupsieve (>=2.9)",
    "idna (>=3.15)",
    "certifi (>=2026.10.19)",
    "setuptools (>=84.1.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true