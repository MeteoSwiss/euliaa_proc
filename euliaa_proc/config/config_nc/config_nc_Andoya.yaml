  u_mie_flag:
    name: u_mie_flag
    dim:
    - time
    - altitude_mie
    type: int64
    _FillValue: -999.0
    original_hdf5:
      hdf5_group: null
      hdf5_var_name: null
    attributes:
      long_name: Quality flag for eastward wind from Doppler shift of Mie peak
